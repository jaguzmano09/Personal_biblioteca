name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy send-auth-email
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Supabase function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN in repository Actions secrets."
            exit 1
          fi
          npx --yes supabase@3.0.0 functions deploy send-auth-email --remote=jhncyzebeqyepmlccvny --no-verify-jwt
